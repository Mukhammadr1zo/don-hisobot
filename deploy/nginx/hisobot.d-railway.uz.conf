# /etc/nginx/sites-available/hisobot.d-railway.uz.conf, symlinked into sites-enabled.
# The app listens on 127.0.0.1:8610 only (deploy/compose.vps.yml). Touches no other site.
# TLS: sudo certbot --nginx -d hisobot.d-railway.uz --redirect   (certbot adds the 443 block and the redirect;
# after that the file on the server differs from this one: edit it in place, do not copy this over it).

server {
    listen 80;
    listen [::]:80;
    server_name hisobot.d-railway.uz;
    charset utf-8;

    # The roster import accepts up to 1 MB; a bigger file gets the app's own Uzbek message, not nginx's.
    client_max_body_size 2m;

    access_log /var/log/nginx/hisobot.access.log;
    error_log  /var/log/nginx/hisobot.error.log;

    location / {
        proxy_pass http://127.0.0.1:8610;
        proxy_set_header Host              $host;
        # The app takes the client IP from the rightmost X-Forwarded-For entry (TRUST_PROXY=1): nginx appends it.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # While the app restarts (deploy, update) people see Uzbek text instead of nginx's English 502.
    error_page 502 503 504 = @down;
    location @down {
        default_type "text/html; charset=utf-8";
        return 503 '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Дон ҳисоботи</title><body style="font:18px/1.5 system-ui,sans-serif;max-width:32rem;margin:15vh auto;padding:0 20px"><h1>Тизим қайта ишга тушмоқда</h1><p>Бир дақиқадан сўнг саҳифани янгиланг.</p>';
    }
}
