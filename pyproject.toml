[project]
name = "hisobot"
version = "0.1.0"
description = "Дон маҳсулотларини кунлик тушириш ҳисоботи"
requires-python = "==3.12.*"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]",
    "openpyxl",
    "defusedxml",
    "gunicorn",
    "whitenoise",
]

[tool.ruff]
line-length = 120
extend-exclude = ["hisobot/migrations"]

[tool.ruff.lint.per-file-ignores]
# Django's Meta.constraints / Change.KINDS are class-level lists by design.
"hisobot/models.py" = ["RUF012"]
