# Server stack. Values come from .env next to this file (see .env.example).
name: hisobot

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

  web:
    build: .
    restart: unless-stopped
    environment:
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required in .env}
      TRUST_PROXY: "1"
      ALLOWED_HOSTS: ${DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: hisobot
      DB_USER: hisobot
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
    depends_on:
      db:
        condition: service_healthy
    # Healthy once gunicorn listens, which the CMD reaches only after migrate: `docker compose up --wait` returns then.
    # A TCP connect writes no access-log line (an HTTP check would, every 10 s).
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 5).close()"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 60s
    logging: *logging

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: hisobot
      POSTGRES_USER: hisobot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hisobot", "-d", "hisobot"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
